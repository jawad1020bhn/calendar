<script>
window.onerror = function(msg, url, line, col, err) {
    var d = document.createElement('div');
    d.style.color = 'red';
    d.textContent = 'ERROR: ' + msg + ' at line ' + line + ':' + col;
    document.body.appendChild(d);
};
</script>
<script src="app.js"></script>
<script>
setTimeout(function() {
    var errors = document.querySelectorAll('[style*="color: red"]');
    if (errors.length === 0) {
        var d = document.createElement('div');
        d.style.color = 'green';
        d.textContent = 'NO ERRORS - init completed';
        document.body.appendChild(d);
    }
    var d2 = document.createElement('div');
    d2.style.color = 'blue';
    d2.textContent = 'DOM readyState: ' + document.readyState;
    document.body.appendChild(d2);
}, 1000);
</script>
